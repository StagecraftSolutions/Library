# Hermes: library.stagecraft.solutions → DSM-Reverse-Proxy → 127.0.0.1:8751
name: library

services:
  web:
    build: .
    image: stagecraft-solutions/library:dev
    container_name: library-stagecraft-solutions
    restart: unless-stopped
    ports: ["127.0.0.1:8751:80"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

