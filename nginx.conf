server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types application/json text/csv;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex" always;

    location / { try_files $uri $uri/ =404; }

    # Statische API: von anderen Stagecraft-Diensten (z. B. Rackmanufaktur) im Browser abrufbar
    location /api/ {
        types { application/json json; text/csv csv; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
